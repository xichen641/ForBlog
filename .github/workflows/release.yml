name: Test and release

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'macos-latest']
        node: ['20', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:ci
      - run: npm run package
      - run: npm run validate:release

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Validate matching tag and package
        run: npm run validate:release -- $env:GITHUB_REF_NAME
      - name: Assemble download and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/forblog -DestinationPath "dist/forblog-$env:GITHUB_REF_NAME.zip"
          $assets = @('dist/forblog/main.js', 'dist/forblog/manifest.json', 'dist/forblog/styles.css', "dist/forblog-$env:GITHUB_REF_NAME.zip")
          $lines = $assets | ForEach-Object { "{0}  {1}" -f (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path -Leaf $_) }
          $lines | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag dist/forblog/main.js dist/forblog/manifest.json dist/forblog/styles.css "dist/forblog-$tag.zip" dist/SHA256SUMS.txt --draft --verify-tag --title "ForBlog $tag" --notes-file "docs/releases/$tag.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
